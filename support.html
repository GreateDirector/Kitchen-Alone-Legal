<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — Kitchen Alone</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1A0F; --surface: #1e3a1e; --gold: #FFC840;
    --green: #4CAF50; --text: #ffffff; --subtext: #6a9a6a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
  nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 24px 48px; border-bottom: 1px solid rgba(255,200,64,0.1);
    position: sticky; top: 0; background: rgba(15,26,15,0.95);
    backdrop-filter: blur(10px); z-index: 100;
  }
  .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .nav-logo img { width: 40px; height: 40px; object-fit: contain; }
  .nav-logo span { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold); font-weight: 700; }
  .lang-switcher { display: flex; gap: 8px; }
  .lang-btn {
    background: none; border: 1px solid rgba(255,200,64,0.2); color: var(--subtext);
    padding: 4px 10px; border-radius: 20px; cursor: pointer; font-size: 12px;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .lang-btn.active, .lang-btn:hover { background: var(--gold); color: #111; border-color: var(--gold); }
  .content { max-width: 760px; margin: 0 auto; padding: 60px 24px 80px; }
  .page-title {
    font-family: 'Playfair Display', serif; font-size: clamp(32px, 5vw, 52px);
    font-weight: 900; color: var(--gold); margin-bottom: 8px;
  }
  .subtitle { color: var(--subtext); font-size: 16px; margin-bottom: 48px; line-height: 1.6; }
  .contact-card {
    background: var(--surface); border: 1px solid rgba(255,200,64,0.3);
    border-radius: 20px; padding: 36px; margin-bottom: 32px; text-align: center;
  }
  .contact-card .icon { font-size: 48px; margin-bottom: 16px; }
  .contact-card h2 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--gold); margin-bottom: 10px; }
  .contact-card p { color: var(--subtext); font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
  .contact-btn {
    display: inline-block; background: var(--gold); color: #111;
    padding: 12px 28px; border-radius: 12px; font-weight: 700;
    text-decoration: none; font-size: 15px; transition: transform 0.2s;
  }
  .contact-btn:hover { transform: scale(1.04); }
  .faq { margin-top: 48px; }
  .faq h2 { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--green); margin-bottom: 24px; }
  .faq-item {
    background: var(--surface); border: 1px solid rgba(76,175,80,0.2);
    border-radius: 14px; padding: 20px 24px; margin-bottom: 12px;
  }
  .faq-item h3 { color: var(--gold); font-size: 16px; margin-bottom: 8px; }
  .faq-item p { color: #ccc; font-size: 14px; line-height: 1.6; }
  footer {
    border-top: 1px solid rgba(255,200,64,0.1); padding: 32px 48px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
  }
  .footer-links { display: flex; gap: 24px; }
  .footer-links a { color: var(--subtext); text-decoration: none; font-size: 14px; transition: color 0.2s; }
  .footer-links a:hover { color: var(--gold); }
  .footer-copy { color: var(--subtext); font-size: 13px; }
  @media (max-width: 640px) {
    nav { padding: 16px 20px; }
    footer { padding: 24px 20px; flex-direction: column; text-align: center; }
    .footer-links { justify-content: center; }
  }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">
    <img src="logo.png" alt="Kitchen Alone">
    <span>Kitchen Alone</span>
  </a>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('ru')">RU</button>
    <button class="lang-btn" onclick="setLang('es')">ES</button>
    <button class="lang-btn" onclick="setLang('fr')">FR</button>
  </div>
</nav>

<div class="content" id="content"></div>

<footer>
  <div class="footer-links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="support.html">Support</a>
    <a href="index.html">Home</a>
  </div>
  <p class="footer-copy">© 2026 Kitchen Alone. All rights reserved.</p>
</footer>

function setLang(lang) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
  document.getElementById('content').innerHTML = content[lang];
}

setLang('en');
</script>
</body>
</html>
