function toggleNav() {
  var nav = document.getElementById('siteNav');
  var panel = document.getElementById('navMobilePanel');
  var btn = document.getElementById('navToggle');
  if (!nav || !panel || !btn) return;
  var open = nav.classList.toggle('nav-open');
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  panel.hidden = !open;
}

function closeNav() {
  var nav = document.getElementById('siteNav');
  var panel = document.getElementById('navMobilePanel');
  var btn = document.getElementById('navToggle');
  if (nav) nav.classList.remove('nav-open');
  if (panel) panel.hidden = true;
  if (btn) {
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-label', 'Open menu');
  }
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeNav();
});

function setLang(lang) {
  document.documentElement.lang = lang;
  closeNav();
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
  document.getElementById('content').innerHTML = content[lang].html;
  document.title = content[lang].docTitle + ' — Kitchen Alone';
  document.querySelectorAll('footer [data-i18n]').forEach(function (el) {
    const key = el.getAttribute('data-i18n');
    if (content[lang][key]) el.textContent = content[lang][key];
  });
  document.querySelectorAll('.site-nav [data-i18n]').forEach(function (el) {
    const key = el.getAttribute('data-i18n');
    if (navI18n[lang] && navI18n[lang][key]) el.textContent = navI18n[lang][key];
  });
}

setLang('en');
