<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy — Kitchen Alone</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1A0F; --surface: #1e3a1e; --gold: #FFC840;
    --green: #4CAF50; --text: #ffffff; --subtext: #6a9a6a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
  nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 24px 48px; border-bottom: 1px solid rgba(255,200,64,0.1);
    position: sticky; top: 0; background: rgba(15,26,15,0.95);
    backdrop-filter: blur(10px); z-index: 100;
  }
  .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .nav-logo img { width: 40px; height: 40px; object-fit: contain; }
  .nav-logo span { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold); font-weight: 700; }
  .lang-switcher { display: flex; gap: 8px; }
  .lang-btn {
    background: none; border: 1px solid rgba(255,200,64,0.2); color: var(--subtext);
    padding: 4px 10px; border-radius: 20px; cursor: pointer; font-size: 12px;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .lang-btn.active, .lang-btn:hover { background: var(--gold); color: #111; border-color: var(--gold); }
  .content { max-width: 760px; margin: 0 auto; padding: 60px 24px 80px; }
  .page-title {
    font-family: 'Playfair Display', serif; font-size: clamp(32px, 5vw, 52px);
    font-weight: 900; color: var(--gold); margin-bottom: 8px;
  }
  .effective-date { color: var(--subtext); font-size: 14px; margin-bottom: 48px; }
  .section { margin-bottom: 40px; }
  .section h2 {
    font-family: 'Playfair Display', serif; font-size: 22px;
    color: var(--green); margin-bottom: 12px;
    padding-bottom: 8px; border-bottom: 1px solid rgba(76,175,80,0.2);
  }
  .section p { color: #ccc; line-height: 1.8; font-size: 15px; margin-bottom: 12px; }
  .section ul { padding-left: 20px; }
  .section ul li { color: #ccc; line-height: 1.8; font-size: 15px; margin-bottom: 6px; }
  .section ul li strong { color: var(--gold); }
  .contact-box {
    background: var(--surface); border: 1px solid rgba(255,200,64,0.2);
    border-radius: 16px; padding: 24px; margin-top: 16px;
  }
  .contact-box a { color: var(--gold); text-decoration: none; }
  footer {
    border-top: 1px solid rgba(255,200,64,0.1); padding: 32px 48px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
  }
  .footer-links { display: flex; gap: 24px; }
  .footer-links a { color: var(--subtext); text-decoration: none; font-size: 14px; transition: color 0.2s; }
  .footer-links a:hover { color: var(--gold); }
  .footer-copy { color: var(--subtext); font-size: 13px; }
  @media (max-width: 640px) {
    nav { padding: 16px 20px; }
    footer { padding: 24px 20px; flex-direction: column; text-align: center; }
    .footer-links { justify-content: center; }
  }

</head>
<body>

<nav>

function setLang(lang) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
  document.getElementById('content').innerHTML = content[lang];
}
